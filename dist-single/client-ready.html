oduct shifts."},{day:18,title:"Draft a public Before/After case study post",formula:"Lead with the quantified result, not the software tool used."},{day:19,title:"Send Day 7 follow-ups to non-responders",formula:"Graceful exit, not guilt trip. Moves non-responders to quarterly list."},{day:20,title:"Pitch a Retainer (monthly) package to an existing lead",formula:"Frame around their convenience ('no need to re-brief every month')."},{day:21,title:"Research 3 international startups that recently got funding",formula:"Funded companies have both budget and urgency."}]},{week:4,title:"Convert & Systemize",subtitle:"Days 22–30",goal:"The final stretch turns conversations into signed work, and signed work into testimonials — then hands you a repeatable playbook.",days:[{day:22,title:"Send hyper-personalised emails to the 3 funded startup founders",formula:"Mention their funding round and specific growth bottleneck."},{day:23,title:"Engage in 2 industry-specific communities (add value, no spam)",formula:"Answer questions completely before mentioning what you do."},{day:24,title:"Review your pricing. Are you underselling? Recalculate",formula:"If you closed 2+ paid projects, raise new-client rates by 15-20%."},{day:25,title:"Practice the 'Reduce the Scope' negotiation script out loud",formula:"Never drop rate on same scope. Say it out loud 3 times."},{day:26,title:"Draft your standard 1-page Freelance Contract",formula:"Use Document 11 from the Vault. Contracts establish professionalism."},{day:27,title:"Follow up with all active leads and push for a decision",formula:"Use deadline boundary: 'I can hold this start date until Friday'."},{day:28,title:"Ask your first client for a specific testimonial",formula:"Send Template 08 with a pre-written draft they can just approve."},{day:29,title:"Publish the testimonial on LinkedIn & portfolio",formula:"Social proof hidden in a folder does zero selling for you."},{day:30,title:"Review 30-day metrics and build your Month 2 engine",fo
