c Before/After case study post",formula:"Lead with the quantified result, not the software tool used."},{day:19,title:"Send Day 7 follow-ups to non-responders",formula:"Graceful exit, not guilt trip. Moves non-responders to quarterly list."},{day:20,title:"Pitch a Retainer (monthly) package to an existing lead",formula:"Frame around their convenience ('no need to re-brief every month')."},{day:21,title:"Research 3 international startups that recently got funding",formula:"Funded companies have both budget and urgency."}]},{week:4,title:"Convert & Systemize",subtitle:"Days 22–30",goal:"The final stretch turns conversations into signed work, and signed work into testimonials — then hands you a repeatable playbook.",days:[{day:22,title:"Send hyper-personalised emails to the 3 funded startup founders",formula:"Mention their funding round and specific growth bottleneck."},{day:23,title:"Engage in 2 industry-specific communities (add value, no spam)",formula:"Answer questions completely before mentioning what you do."},{day:24,title:"Review your pricing. Are you underselling? Recalculate",formula:"If you closed 2+ paid projects, raise new-client rates by 15-20%."},{day:25,title:"Practice the 'Reduce the Scope' negotiation script out loud",formula:"Never drop rate on same scope. Say it out loud 3 times."},{day:26,title:"Draft your standard 1-page Freelance Contract",formula:"Use Document 11 from the Vault. Contracts establish professionalism."},{day:27,title:"Follow up with all active leads and push for a decision",formula:"Use deadline boundary: 'I can hold this start date until Friday'."},{day:28,title:"Ask your first client for a specific testimonial",formula:"Send Template 08 with a pre-written draft they can just approve."},{day:29,title:"Publish the testimonial on LinkedIn & portfolio",formula:"Social proof hidden in a folder does zero selling for you."},{day:30,title:"Review 30-day metrics and build your Month 2 engine",formula:"Double down on your #1 best channel; Want me to send over what that agreement would look like?`,proTip:"Frame the retainer around THEIR convenience first, your income stability second.",niche:"general"}],Y6=[{q:"What if I don't get replies in the first week?",a:"Completely normal. The average cold outreach reply rate in freelancing is low if you blast generic messages. Day 13's review in the Workbook exists specifically so you diagnose your open rates and adjust the hook based on data, rather than quitting out of frustration."},{q:"Should I work for free to build my portfolio?",a:"Rarely. As Chapter 02 explains, working for free anchors your value at ₹0 and attracts high-maintenance clients. Instead, use 'Targeted Spec Work' (unsolicited samples you build on your own terms in under 2 hours) and 'Contra Deals' (bartering a service for a video testimonial or software pass). You get 100% of the proof with none of the exploitation."},{q:"Will this work for Indian clients who always haggle?",a:"Yes. In fact, Chapter 07 is dedicated entirely to 'The India Context'. Indian clients negotiate as a matter of cultural principle, not necessarily because they lack budget. The system teaches you the 15% negotiation buffer and the 'Scope Reduction' script so you always protect your hourly floor without losing deals."},{q:"Can this system help me close high-paying US/UK/EU clients?",a:"Absolutely. Week 2 (Day 10) and Week 3 (Day 21) focus on the International Outreach Engine — how to find recently funded international startups, reach founders in their timezone, send HRPA cold emails in clean English, and invoice in USD/EUR without getting stuck in currency friction."},{q:"What format do I receive the files in?",a:"You get instant lifetime access to beautifully formatted, high-resolution PDF editions of both 'Client Ready' (80 pages) and the implementation workbooks. They are fully printable and work on any laptop, tablet, or phone."},{q:"What if a client ghosts after the advance payment conversation?",a:"That is the system working, not failing! If a client refuses a standard 50% advance before you start work, they were almost certainly going to delay or default on your final invoice. The system weeds out non-paying clients before you sink 30 unbillable hours into their project."}],ue="/app/applet/src/components/SolutionSection.tsx",G6=({onOpenSampleReader:a})=>{const[r,u]=(0,I.useState)("part1"),[d,f]=(0,I.useState)(1);return(0,s.jsxDEV)("section",{id:"system",className:"py-24 bg-[#FDFBF7] texture-paper-grain relative overflow-hidden",children:[(0,s.jsxDEV)("div",{"aria-hidden":"true",className:"absolute top-12 left-1/2 -translate-x-1/2 w-4/5 h-80 bg-gradient-to-b from-[#B8860B]/5 via-[#D4AF37]/3 to-transparent blur-3xl pointer-events-none rounded-full"},void 0,!1,{fileName:ue,lineNumber:38,columnNumber:7},void 0),(0,s.jsxDEV)("div",{className:"max-w-6xl mx-auto px-4 sm:px-6 relative z-10",children:[(0,s.jsxDEV)(xt,{children:(0,s.jsxDEV)("div",{className:"text-center max-w-3xl mx-auto mb-16",children:[(0,s.jsxDEV)("p",{className:"text-xs font-semibold uppercase tracking-[0.2em] text-[#B8860B] mb-3",children:"The Blueprint"},void 0,!1,{fileName:ue,lineNumber:48,columnNumber:13},void 0),(0,s.jsxDEV)("h2",{className:"text-3xl sm:text-4xl lg:text-5xl font-serif font-bold text-[#1A252F] tracking-[-0.02em] leading-[1.15] [text-wrap:balance]",children:"Introducing: The Client Ready System"},void 0,!1,{fileName:ue,lineNumber:51,columnNumber:13},void 0),(0,s.jsxDEV)("p",{className:"mt-4 text-base sm:text-lg text-stone-600 font-sans leading-[1.65]",children:"A highly tactical, step-by-step framework built specifically for the Indian market context and international outreach. No motivational fluff. Just pure execution."},void 0,!1,{fileName:ue,lineNumber:54,columnNumber:13},void 0)]},void 0,!0,{fileName:ue,lineNumber:47,columnNumber:11},void 0)},void 0,!1,{fileName:ue,lineNumber:46,columnNumber:9},void 0),(0,s.jsxDEV)("div",{className:"grid grid-cols-1 md:grid-cols-3 gap-8 mb-16",children:
